<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:16px system-ui;color:#19392e;margin:0}button{padding:8px}article{padding:14px;background:#eff2e7;border-radius:10px;margin-top:10px}</style>
<div id="archivecontrol_editmode"><strong>第 <span id="move_nbr"></span> 步</strong> <button id="archive_next">原版下一步</button> <button id="go_to_new_turn">原版下一位玩家</button></div>
<article id="action"></article>
<script>
const labels=['建造围栏','选择动物行动','支持保护项目','休息并结算收入'];
const players=['玩家 A','玩家 B','玩家 C'];
let move = Number(new URL(parent.location.href).searchParams.get('goto')) || 1;
function paint(){document.getElementById('move_nbr').textContent=move; document.getElementById('action').textContent=players[Math.floor((move-1)/3)%3]+' · '+labels[(move-1)%4]}
document.getElementById('archive_next').onclick=()=>{move++;paint()};document.getElementById("go_to_new_turn").onclick=()=>{move=Math.floor((move-1)/3)*3+4;paint()};paint();
</script></html>
